name: Build & deploy QoreDB Showcase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/qoredb/qoredb-showcase

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_SANITY_API_VERSION=${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
            NEXT_PUBLIC_UMAMI_SRC=${{ secrets.NEXT_PUBLIC_UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            SANITY_TOKEN=${{ secrets.SANITY_TOKEN }}
            SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Coolify redeploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::COOLIFY_WEBHOOK non defini - deploiement NON declenche"
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::COOLIFY_TOKEN non defini - deploiement NON declenche"
            exit 1
          fi
          code=$(curl -sS -o /tmp/coolify.out -w '%{http_code}' \
            -X GET "$WEBHOOK" -H "Authorization: Bearer $TOKEN")
          echo "Coolify a repondu HTTP $code"
          echo "--- corps de la reponse ---"
          cat /tmp/coolify.out; echo
          case "$code" in
            2??) echo "Coolify triggered" ;;
            401|403) echo "::error::COOLIFY_TOKEN invalide ou sans droit de deploiement (HTTP $code)"; exit 1 ;;
            404) echo "::error::UUID inconnu dans COOLIFY_WEBHOOK (HTTP 404)"; exit 1 ;;
            405) echo "::error::Mauvaise URL : attendu https://<coolify>/api/v1/deploy?uuid=<uuid>&force=false (HTTP 405)"; exit 1 ;;
            *)   echo "::error::Echec du declenchement Coolify (HTTP $code)"; exit 1 ;;
          esac
